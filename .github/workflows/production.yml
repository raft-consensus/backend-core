name: production

on:
  push:
    branches:
      - main

permissions:
  packages: write
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        run: |
          docker build -f Dockerfile -t ghcr.io/${{ github.repository }}:latest .
          docker push ghcr.io/${{ github.repository }}:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: production

    steps:
      # MySQL (and SQL Server/Postgres/Mongo) run as independent containers already managed
      # on the VPS, outside this repo — docker-compose.yml here only declares the backend
      # service itself, so the VPS just needs that one file, not any init scripts.
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Copy compose file to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.USER }}
          key: ${{ secrets.SSH_KEY }}
          port: 22
          source: "docker-compose.yml"
          target: "/app/${{ github.event.repository.name }}/"

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.USER }}
          key: ${{ secrets.SSH_KEY }}
          port: 22
          envs: APP_SETTINGS,GH_TOKEN,GH_REPOSITORY,CONTAINER_NAME
          script: |
            set -e
            cd /app/$CONTAINER_NAME

            echo "$GH_TOKEN" | docker login ghcr.io -u github-actions --password-stdin

            echo "$APP_SETTINGS" > appsettings.json

            cat > .env <<EOF
            BACKEND_IMAGE=ghcr.io/$GH_REPOSITORY:latest
            CONTAINER_NAME=$CONTAINER_NAME
            EOF

            docker compose pull backend
            docker compose up -d backend
            docker compose ps
        env:
          APP_SETTINGS: ${{ secrets.APP_SETTINGS }}
          GH_TOKEN: ${{ secrets.TOKEN }}
          GH_REPOSITORY: ${{ github.repository }}
          CONTAINER_NAME: ${{ github.event.repository.name }}
